; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
lib_deps = 
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0

[env:nodo_1]
build_flags = -DNODALVIA_NODE_ID=1

[env:nodo_2]
build_flags = -DNODALVIA_NODE_ID=2

[env:nodo_3]
build_flags = -DNODALVIA_NODE_ID=3

[env:nodo_4]
build_flags = -DNODALVIA_NODE_ID=4

[env:nodo_5]
build_flags = -DNODALVIA_NODE_ID=5

[env:nodo_6]
build_flags = -DNODALVIA_NODE_ID=6

[env:nodo_7]
build_flags = -DNODALVIA_NODE_ID=7

[env:nodo_8]
build_flags = -DNODALVIA_NODE_ID=8
